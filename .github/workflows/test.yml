name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build
        env:
          VITE_FIREBASE_API_KEY: "dummy"
          VITE_FIREBASE_AUTH_DOMAIN: "dummy"
          VITE_FIREBASE_PROJECT_ID: "dummy"
          VITE_FIREBASE_STORAGE_BUCKET: "dummy"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "dummy"
          VITE_FIREBASE_APP_ID: "dummy"
          VITE_FIREBASE_MEASUREMENT_ID: "dummy"

      - name: Run tests
        run: bun run test

      - name: Audit production dependencies
        run: bun audit --prod || true
