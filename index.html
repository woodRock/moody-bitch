<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Skyrim Wellbeing Manager</title>
    <meta name="description" content="A Skyrim-themed habit and mood tracker. Turn your day into quests, level up your real skills, chart your journey." />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dragonborn" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="./icons/favicon-64.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Crimson+Text:ital,wght@0,400;0,700;1,400&family=Jost:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      // Restore a deep link that public/404.html bounced through the query string (GitHub Pages SPA routing).
      (function (l) {
        var m = /[?&]p=([^&]*)/.exec(l.search);
        if (!m) return;
        var path = decodeURIComponent(m[1]).replace(/~and~/g, '&');
        if (path.charAt(0) !== '/') return;
        var q = /[?&]q=([^&]*)/.exec(l.search);
        var query = q ? '?' + decodeURIComponent(q[1]).replace(/~and~/g, '&') : '';
        window.history.replaceState(null, null, l.pathname.replace(/\/$/, '') + path + query + l.hash);
      }(window.location));
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Skyrim Wellbeing Manager needs JavaScript to open the realm.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
